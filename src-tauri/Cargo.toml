[package]
name = "amitos"
version = "1.0.0"
description = "AmitOS — Universal AI OS for humans"
authors = ["AmitOS Contributors"]
license = "MIT"
repository = "https://github.com/amitos/amitos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "amitos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.20", features = ["vendored-libgit2"] }
once_cell = "1.21"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-stronghold = "2.3.1"

[profile.dev.package.scrypt]
opt-level = 3
