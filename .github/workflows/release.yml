name: AmitOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ─── Tests ─────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun run test

  # ─── Desktop: macOS ────────────────────────────────────────────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install frontend deps
        run: bun install
      - name: Build AmitOS (macOS universal)
        run: bun run tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amitos-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  # ─── Desktop: Windows ──────────────────────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebView2 (if needed)
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'webview2installer.exe'
          Start-Process -Wait -FilePath 'webview2installer.exe' -Args '/silent /install'
        shell: powershell
        continue-on-error: true
      - name: Install frontend deps
        run: bun install
      - name: Build AmitOS (Windows)
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amitos-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ─── Desktop: Linux ────────────────────────────────────────────────────────
  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev
      - name: Install frontend deps
        run: bun install
      - name: Build AmitOS (Linux)
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amitos-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  # ─── Android APK ───────────────────────────────────────────────────────────
  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV
      - name: Install Cargo NDK targets
        run: cargo install cargo-ndk
      - name: Install frontend deps
        run: bun install
      - name: Add Android Tauri mobile target
        run: bun run tauri android init
        continue-on-error: true
      - name: Build Android APK
        run: bun run tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        continue-on-error: true
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: amitos-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        if: always()

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AmitOS ${{ github.ref_name }}
          body: |
            # AmitOS ${{ github.ref_name }} — Universal AI OS

            ## What's Included
            - **Desktop apps**: macOS (.dmg), Windows (.exe/.msi), Linux (.AppImage/.deb)
            - **Android APK**: Native mobile app
            - **35+ AI tools** pre-configured and ready to deploy
            - **50+ API provider** key manager (Stronghold-backed)
            - **Kaizen OS**: Today Board, task decomposition, 8 life domains
            - **Memory Spine**: Persistent knowledge capture and search
            - **Voice Mode**: Web Speech API + command routing
            - **MCP Browser**: Playwright, Firecrawl, GitHub, Brave Search ready
            - **Mobile Sync**: QR-code pairing with local network server

            ## Install in 30 Seconds
            1. Download the installer for your OS
            2. Run it (no admin needed on macOS/Linux)
            3. Open AmitOS → API Keys → add your first key
            4. Done!

            ## Add Any API Key in 30 Seconds
            1. Go to **API Keys** tab
            2. Find your provider (50+ listed)
            3. Click the card → paste your key → Save
            4. Deploy any tool — keys auto-injected

            ## Full Changelog
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.apk
          draft: true
          generate_release_notes: true
